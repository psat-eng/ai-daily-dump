<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Daily Dump</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #171b26;
    --border: #2a2f42;
    --text: #e2e5f0;
    --muted: #7b829a;
    --accent: #5b8af5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .wrap {
    text-align: center;
    max-width: 480px;
  }
  .eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }
  h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }
  .sub {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 32px;
  }
  .status {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 24px;
    font-size: 14px;
  }
  .status a { color: var(--accent); text-decoration: none; }
  .status a:hover { text-decoration: underline; }
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Pranesh Satish</div>
  <h1>AI Daily Dump</h1>
  <p class="sub">Fresh AI news for inference engineers &middot; Auto-generated each morning</p>
  <div class="status" id="status">
    <span class="spinner"></span> Loading today&rsquo;s issue&hellip;
  </div>
</div>

<script>
(function () {
  const pad = n => String(n).padStart(2, '0');
  const d = new Date();
  const today = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const url = `./${today}.html`;

  // Try to fetch today's file; if it exists, redirect immediately.
  fetch(url, { method: 'HEAD' })
    .then(r => {
      if (r.ok) {
        window.location.replace(url);
      } else {
        showFallback(today);
      }
    })
    .catch(() => showFallback(today));

  function showFallback(today) {
    document.getElementById('status').innerHTML =
      `Today&rsquo;s issue (<strong>${today}</strong>) hasn&rsquo;t been generated yet &mdash; ` +
      `check back after the morning run, or browse an earlier issue below.`;

    // List recent issues by probing the last 14 days
    const links = [];
    const checks = [];
    for (let i = 1; i <= 14; i++) {
      const dt = new Date(d);
      dt.setDate(dt.getDate() - i);
      const dateStr = `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
      checks.push(
        fetch(`./${dateStr}.html`, { method: 'HEAD' })
          .then(r => r.ok ? links.push({ dateStr, dt }) : null)
          .catch(() => null)
      );
    }
    Promise.all(checks).then(() => {
      if (links.length === 0) return;
      links.sort((a, b) => b.dt - a.dt);
      const ul = links.slice(0, 7).map(({ dateStr }) =>
        `<li style="margin-top:8px"><a href="./${dateStr}.html">${dateStr}</a></li>`
      ).join('');
      document.getElementById('status').innerHTML +=
        `<ul style="list-style:none;margin-top:14px;text-align:left">${ul}</ul>`;
    });
  }
})();
</script>
</body>
</html>
